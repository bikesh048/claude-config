# Profile: fullstack-ts
# Stack: NestJS + Next.js + Prisma + Gutenberg
# Target: tripcart-builder and similar TypeScript fullstack projects

PROFILE_NAME="fullstack-ts"
PROFILE_DESC="TypeScript fullstack (NestJS + Next.js + Prisma + Gutenberg)"

# Shared rules (from project/rules/common/ and project/rules/typescript/)
SHARED_RULES_DIRS=(
  common
  typescript
)

# Project-specific rules (from project/rules/)
RULES=(
  commit-format.md
)

# Project-specific rules (not managed by claude-config, live in each project repo):
#   nestjs.md, nextjs.md, prisma.md, gutenberg.md, cache.md, env-management.md, pipeline.md

# Agents to install (from project/agents/)
AGENTS=(
  code-reviewer.md
  security-auditor.md
)

# Commands to install (from project/commands/)
COMMANDS=(
  op.md
  deliver.md
  dispatch.md
  pr.md
  interview.md
)

# Skills to install (from project/skills/)
SKILLS=(
  playwright-cli
)

# Project-specific skills (not managed by claude-config, live in the project repo):
#   domain-support, extraction-fix, import-fix, learned

# Templates to install (from project/templates/)
TEMPLATES=(
  pull_request_template.md
)
